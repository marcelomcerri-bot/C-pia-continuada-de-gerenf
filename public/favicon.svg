<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Cross Shadow -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Heart Shadow -->
    <filter id="heartShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Heart Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Inner Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container with hospital theme -->
  <rect width="180" height="180" rx="42" fill="url(#bgGrad)"/>
  <rect x="3" y="3" width="174" height="174" rx="39" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- High-contrast Bold Medical Cross -->
  <g filter="url(#glow)">
    <!-- Vertical bar -->
    <rect x="70" y="30" width="40" height="120" rx="10" fill="#ffffff"/>
    <!-- Horizontal bar -->
    <rect x="30" y="70" width="120" height="40" rx="10" fill="#ffffff"/>
  </g>

  <!-- Subtle Center Medical Cross Ring/Emboss -->
  <circle cx="90" cy="90" r="32" fill="#f8fafc" />

  <!-- Heart with ECG Pulse at Center -->
  <g filter="url(#heartShadow)">
    <!-- Red Heart Shape -->
    <path d="M 90 116 
             C 86 112 60 92 60 76 
             C 60 65 69 57 79.5 57 
             C 85 57 88 60 90 63 
             C 92 60 95 57 100.5 57 
             C 111 57 120 65 120 76 
             C 120 92 94 112 90 116 Z" 
          fill="url(#heartGrad)" />

    <!-- Sharp ECG Heartbeat Line across the heart in crisp white -->
    <path d="M 64 78 
             L 76 78 
             L 81 71 
             L 86 87 
             L 93 64 
             L 98 83 
             L 102 78 
             L 116 78" 
          stroke="#ffffff" 
          stroke-width="4" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Small Nursing / Medical Sparkle Badge -->
  <circle cx="142" cy="38" r="6" fill="#38bdf8" />
  <path d="M 142 27 L 144 36 L 153 38 L 144 40 L 142 49 L 140 40 L 131 38 L 140 36 Z" fill="#ffffff" />
</svg>
